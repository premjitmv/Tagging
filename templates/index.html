<!DOCTYPE html>
<html>
<head>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <title>Chat Prediction</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Chat Prediction</h1>
        <form id="chatForm">
            <div class="form-group">
                <label for="newText">Enter a new text:</label>
                <input type="text" class="form-control" id="newText" name="newText" required>
            </div>
            <button type="submit" class="btn btn-primary">Predict</button>
        </form>
        <div id="predictionResult" class="mt-3"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            $("#chatForm").submit(function(e) {
                e.preventDefault();
                var newText = $("#newText").val();
                
                jQuery.ajax({
                    url: "http://127.0.0.1:7083/predict",
                    type: "POST",
                    data: {newText: newText},
                    success: function(response) {
                        $("#predictionResult").html(response);
                    }
                });
            });
        });
    </script>
</body>
</html>
